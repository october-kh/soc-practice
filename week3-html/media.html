<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Elements & Iframe</title>
</head>
<body>
    <h1>HTML Media Elements</h1>
    
    <h2>Video Section</h2>
    <video controls width="640" height="360">
        <source src="images/video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <h2>Iframe Section</h2>
    <h3>Iframe video from youtube</h3>
    <iframe width="420" height="345" src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>

    <h3>Iframe: embed other websites</h3>
    <iframe src="https://www.souladvisor.com/" width="100%" height="500"></iframe>
</body>
</html>
