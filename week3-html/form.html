<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form elements</title>
    <link rel="icon" href="images/favicon.ico">
    <style>
        .form-row {
            margin-bottom: 15px;
        }

        label {
            vertical-align: top;
        }
    </style>
</head>
<body>
    <h1>HTML Forms</h1>
    
    <h2>Sign In Form</h2>
    <form action="/signin" method="post">
        <div class="form-row">
            <label for="signin-email">Email:</label>
            <input type="email" id="signin-email" name="email" placeholder="Enter your email address" required>
        </div>
        
        <div class="form-row">
            <label for="signin-password">Password:</label>
            <input type="password" id="signin-password" name="password" placeholder="Enter your password" required>
        </div>
        
        <div class="form-row">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
        </div>
        
        <div class="form-row">
            <input type="submit" value="Sign In">
        </div>
    </form>
    
    <hr/>
    
    <h2>Sign Up Form</h2>
    <form action="/signup" method="post">
        <div class="form-row">
            <label for="signup-name">Full Name:</label>
            <input type="text" id="signup-name" name="name" placeholder="Enter your full name" required>
        </div>
        
        <div class="form-row">
            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" name="email" placeholder="Enter your email address" required>
        </div>
        
        <div class="form-row">
            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
        </div>
        
        <div class="form-row">
            <label for="signup-confirm-password">Confirm Password:</label>
            <input type="password" id="signup-confirm-password" name="confirm-password" placeholder="Confirm your password" required>
        </div>
        
        <div class="form-row">
            <label for="signup-phone">Phone Number:</label>
            <input type="tel" id="signup-phone" name="phone" placeholder="Enter your phone number">
        </div>
        
        <div class="form-row">
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div>
        
        <div class="form-row">
            <input type="submit" value="Sign Up">
        </div>
    </form>
    
    <hr/>
    
    <h2>Contact Form</h2>
    <form action="/contact" method="get">
        <div class="form-row">
            <label for="contact-name">Name:</label>
            <input type="text" id="contact-name" name="name" placeholder="Enter your name" required>
        </div>
        
        <div class="form-row">
            <label for="contact-email">Email:</label>
            <input type="email" id="contact-email" name="email" placeholder="Enter your email address" required>
        </div>
        
        <div class="form-row">
            <label for="contact-message">Message:</label>
            <textarea id="contact-message" name="message" rows="4" cols="50" placeholder="Enter your message" required></textarea>
        </div>
        
        <div class="form-row">
            <button type="submit">Send</button>
        </div>
    </form>
    <hr/>
</body>
</html>
